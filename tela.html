<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Estoque</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 950px;
            margin: auto;
        }

        h1,
        h2 {
            color: #333;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 120px;
            font-size: 14px;
        }

        button {
            border: none;
            padding: 9px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: #198754;
            color: white;
        }

        .btn-add:hover {
            background-color: #157347;
        }

        .btn-update {
            background-color: #ffc107;
            color: #000;
            display: none;
        }

        .btn-update:hover {
            background-color: #e0a800;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
            display: none;
        }

        .btn-cancel:hover {
            background-color: #5c636a;
        }

        .btn-edit {
            background-color: #ffc107;
            color: #000;
            padding: 6px 10px;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 10px;
        }

        .btn-delete:hover {
            background-color: #bb2d3b;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #e9ecef;
            color: #495057;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .title-icon {
            width: 28px;
            height: 28px;
            fill: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>
            <svg class="title-icon" viewBox="0 0 24 24">
                <path
                    d="M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H4V5h16v14zM6 7h5v5H6zm7 0h5v3h-5zm0 5h5v5h-5zm-7 2h5v3H6z" />
            </svg>
            Controle de Produtos
        </h1>

        <h3 id="form-title">Adicionar Novo Produto</h3>
        <form id="produto-form" onsubmit="salvarProduto(event)">
            <input type="hidden" id="prod-id">
            <div class="form-group">
                <input type="text" id="prod-nome" placeholder="Nome do Produto" required>
                <input type="text" id="prod-preco" placeholder="R$ 0,00" oninput="mascaraMoeda(this)" required>
                <input type="number" id="prod-qtd" placeholder="Quantidade" required>
                <input type="hidden" id="prod-cat" value="1">
                <input type="hidden" id="prod-forn" value="1">
            </div>

            <button type="submit" id="btn-salvar" class="btn-add">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                <span id="btn-text">Cadastrar</span>
            </button>

            <button type="button" id="btn-cancelar" class="btn-cancel" onclick="limparFormulario()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
                Cancelar
            </button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #dee2e6;">

        <h2>Lista de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Qtd</th>
                    <th>Categoria ID</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos">
                <tr>
                    <td colspan="6">Carregando...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://localhost:7102/api/Produtos';

        const formatadorMoeda = new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });

        function mascaraMoeda(input) {
            let valor = input.value.replace(/\D/g, '');
            if (!valor) {
                input.value = '';
                return;
            }
            valor = (parseFloat(valor) / 100).toFixed(2);
            input.value = formatadorMoeda.format(valor);
        }

        function converterMoedaParaFloat(texto) {
            if (!texto) return 0;
            let limpo = texto.replace(/[^\d,]/g, '').replace(',', '.');
            return parseFloat(limpo) || 0;
        }

        async function carregarProdutos() {
            const tbody = document.getElementById('tabela-produtos');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const produtos = await res.json();

                tbody.innerHTML = '';
                if (produtos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">Nenhum produto cadastrado.</td></tr>';
                    return;
                }

                produtos.forEach(p => {
                    const qtd = p.quantidadeEstoque ?? p.quantidade ?? 0;
                    const precoFormatado = formatadorMoeda.format(p.preco || 0);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${p.id}</td>
                    <td><strong>${p.nome}</strong></td>
                    <td>${precoFormatado}</td>
                    <td>${qtd}</td>
                    <td>${p.categoriaId}</td>
                    <td class="actions">
                        <button class="btn-edit" onclick='prepararEdicao(${JSON.stringify(p)})' title="Editar">
                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            Editar
                        </button>
                        <button class="btn-delete" onclick="excluirProduto(${p.id})" title="Excluir">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            Excluir
                        </button>
                    </td>
                `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="color:red">Erro ao conectar à API! Verifique se ela está rodando.</td></tr>';
            }
        }

        async function salvarProduto(event) {
            event.preventDefault();

            const id = document.getElementById('prod-id').value;
            const precoTexto = document.getElementById('prod-preco').value;

            const payload = {
                id: id ? parseInt(id) : 0,
                nome: document.getElementById('prod-nome').value,
                preco: converterMoedaParaFloat(precoTexto),
                quantidadeEstoque: parseInt(document.getElementById('prod-qtd').value),
                categoriaId: parseInt(document.getElementById('prod-cat').value),
                fornecedorId: parseInt(document.getElementById('prod-forn').value)
            };

            const isEdicao = !!id;
            const url = isEdicao ? `${API_URL}/${id}` : API_URL;
            const method = isEdicao ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    limparFormulario();
                    carregarProdutos();
                } else {
                    alert('Erro ao salvar produto. Verifique os dados.');
                }
            } catch (err) {
                alert('Falha de conexão com a API.');
            }
        }

        function prepararEdicao(p) {
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nome').value = p.nome;

            document.getElementById('prod-preco').value = formatadorMoeda.format(p.preco || 0);

            document.getElementById('prod-qtd').value = p.quantidadeEstoque ?? p.quantidade ?? 0;
            document.getElementById('prod-cat').value = p.categoriaId;
            document.getElementById('prod-forn').value = p.fornecedorId ?? 1;

            document.getElementById('form-title').innerText = `Editar Produto #${p.id}`;
            document.getElementById('btn-text').innerText = 'Atualizar';

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.className = 'btn-update';
            btnSalvar.style.display = 'inline-flex';
            document.getElementById('btn-cancelar').style.display = 'inline-flex';
        }

        function limparFormulario() {
            document.getElementById('produto-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('form-title').innerText = 'Adicionar Novo Produto';
            document.getElementById('btn-text').innerText = 'Cadastrar';

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.className = 'btn-add';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        async function excluirProduto(id) {
            if (!confirm(`Deseja realmente excluir o produto #${id}?`)) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    carregarProdutos();
                } else {
                    alert('Erro ao excluir o produto.');
                }
            } catch (err) {
                alert('Falha de conexão com a API.');
            }
        }

        carregarProdutos();
    </script>

</body>

</html>
